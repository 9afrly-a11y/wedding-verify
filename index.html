<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Verification - Alyafei</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f0e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 0 2rem; }
  .top-bar { width: 100%; background: #1a1208; padding: 1rem 1.25rem 0.85rem; text-align: center; position: relative; }
  .top-bar .arabic { color: #c8a96e; font-size: 20px; font-weight: 600; direction: rtl; margin-bottom: 3px; }
  .top-bar .sub { color: rgba(200,169,110,0.5); font-size: 11px; letter-spacing: 0.08em; }
  .settings-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: rgba(200,169,110,0.15); border: 1px solid rgba(200,169,110,0.3); color: #c8a96e; border-radius: 8px; padding: 6px 10px; font-size: 18px; cursor: pointer; }
  .main { width: 100%; max-width: 440px; padding: 1.25rem 1rem 0; }
  .settings-panel { display: none; background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; }
  .settings-panel h3 { font-size: 14px; color: #555; margin-bottom: 12px; font-weight: 600; }
  .settings-panel label { display: block; font-size: 12px; color: #777; margin-bottom: 4px; margin-top: 10px; }
  .settings-panel input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #1a1208; outline: none; }
  .settings-panel input:focus { border-color: #c8a96e; }
  .save-btn { width: 100%; margin-top: 12px; background: #1a1208; color: #c8a96e; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .camera-card { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; }
  .cam-toggle { background: #1a1208; color: #c8a96e; border: none; border-radius: 8px; padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; text-align: center; }
  .cam-toggle.active { background: #c0392b; color: #fff; }
  .cam-toggle:active { transform: scale(0.98); }
  .viewfinder-wrap { display: none; position: relative; margin-top: 12px; border-radius: 12px; overflow: hidden; background: #000; }
  #cam-video { width: 100%; display: block; border-radius: 12px; max-height: 300px; object-fit: cover; }
  #cam-canvas { display: none; }
  .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .scan-box-frame { width: 190px; height: 190px; position: relative; }
  .scan-box-frame::before, .scan-box-frame::after, .scan-box-frame span::before, .scan-box-frame span::after { content: ""; position: absolute; width: 26px; height: 26px; border-color: #c8a96e; border-style: solid; }
  .scan-box-frame::before { top:0; left:0; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
  .scan-box-frame::after  { top:0; right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
  .scan-box-frame span::before { bottom:0; left:0; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
  .scan-box-frame span::after  { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
  .scan-line { position: absolute; left:6%; right:6%; height:2px; background: linear-gradient(90deg, transparent, #c8a96e, transparent); animation: scanline 1.8s ease-in-out infinite; }
  @keyframes scanline { 0% { top:8%; opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { top:88%; opacity:0; } }
  .cam-status { text-align: center; font-size: 12px; color: #aaa; margin-top: 8px; min-height: 18px; }
  .cam-status.scanning { color: #c8a96e; }
  .cam-status.found    { color: #27ae60; font-weight: 600; }
  .cam-status.error    { color: #e74c3c; }
  .engine-badge { text-align: center; font-size: 10px; color: #bbb; margin-top: 4px; }
  .divider-row { display: flex; align-items: center; gap: 10px; margin: 1rem 0 0.75rem; }
  .divider-row hr { flex:1; border:none; border-top:1px solid #e0d8c8; }
  .divider-row span { font-size: 12px; color: #bbb; white-space: nowrap; }
  .scan-box { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; text-align: center; }
  .scan-box p { font-size: 13px; color: #888; margin-bottom: 10px; }
  .scan-box input { width: 100%; border: 1.5px solid #e0d8c8; border-radius: 10px; padding: 12px 14px; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; color: #1a1208; outline: none; margin-bottom: 10px; -webkit-appearance: none; }
  .scan-box input:focus { border-color: #c8a96e; }
  .verify-btn { width: 100%; background: #1a1208; color: #c8a96e; border: none; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .verify-btn:active { transform: scale(0.98); }
  .result-card { border-radius: 14px; padding: 1.25rem; text-align: center; margin-bottom: 1rem; display: none; animation: pop 0.2s ease; }
  @keyframes pop { from { transform:scale(0.95); opacity:0.5; } to { transform:scale(1); opacity:1; } }
  .result-card.valid     { background: #eafaf1; border: 2px solid #27ae60; }
  .result-card.invalid   { background: #fdf0f0; border: 2px solid #e74c3c; }
  .result-card.duplicate { background: #fff8e6; border: 2px solid #f39c12; }
  .result-icon  { font-size: 52px; margin-bottom: 6px; }
  .result-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .result-card.valid     .result-title { color: #1e8449; }
  .result-card.invalid   .result-title { color: #c0392b; }
  .result-card.duplicate .result-title { color: #d68910; }
  .result-sub { font-size: 14px; margin-bottom: 6px; }
  .result-card.valid     .result-sub { color: #27ae60; }
  .result-card.invalid   .result-sub { color: #e74c3c; }
  .result-card.duplicate .result-sub { color: #f39c12; }
  .result-id { font-size: 12px; font-family: monospace; opacity: 0.6; color: #333; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .stat { background: #fff; border: 1px solid #e0d8c8; border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; margin-bottom: 2px; color: #1a1208; }
  .stat .lbl { font-size: 11px; color: #999; }
  .stat.green .val { color: #27ae60; }
  .stat.red   .val { color: #e74c3c; }
  .log-wrap { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1rem; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .log-header span { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.06em; text-transform: uppercase; }
  .log-header button { font-size: 11px; padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background: #f9f9f9; cursor: pointer; color: #888; }
  .log-list { list-style: none; max-height: 220px; overflow-y: auto; }
  .log-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; margin-bottom: 4px; font-size: 13px; }
  .log-item.v { background: #eafaf1; } .log-item.i { background: #fdf0f0; } .log-item.d { background: #fff8e6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .v .dot { background: #27ae60; } .i .dot { background: #e74c3c; } .d .dot { background: #f39c12; }
  .id-text { flex: 1; font-family: monospace; font-size: 12px; color: #333; }
  .time-text { font-size: 11px; color: #aaa; white-space: nowrap; }
  .empty-log { font-size: 13px; color: #bbb; text-align: center; padding: 16px 0; }
  .footer { margin-top: 1.5rem; text-align: center; font-size: 11px; color: #bbb; letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="top-bar">
  <p class="arabic" id="top-arabic">&#1581;&#1601;&#1604; &#1586;&#1601;&#1575;&#1601; &#1593;&#1576;&#1583;&#1575;&#1604;&#1585;&#1581;&#1605;&#1606; &#1575;&#1604;&#1610;&#1575;&#1601;&#1593;&#1610;</p>
  <p class="sub">GUEST VERIFICATION SYSTEM</p>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
</div>

<div class="main">
  <div class="settings-panel" id="settings-panel">
    <h3>&#9881; SETTINGS</h3>
    <label>Total number of cards issued</label>
    <input type="number" id="set-total" value="400" min="1" max="9999">
    <label>Card ID prefix</label>
    <input type="text" id="set-prefix" value="ALYAFEI-WED-2026">
    <label>Event name (Arabic)</label>
    <input type="text" id="set-arabic" value="&#1581;&#1601;&#1604; &#1586;&#1601;&#1575;&#1601; &#1593;&#1576;&#1583;&#1575;&#1604;&#1585;&#1581;&#1605;&#1606; &#1575;&#1604;&#1610;&#1575;&#1601;&#1593;&#1610;" dir="rtl">
    <button class="save-btn" onclick="saveSettings()">Save &amp; Apply</button>
  </div>

  <div class="camera-card">
    <button class="cam-toggle" id="cam-btn" onclick="openCamera()">&#128247; &nbsp;Scan QR Code</button>
    <input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="handleCapture(this)">
    <canvas id="cam-canvas" style="display:none"></canvas>
    <div class="cam-status" id="cam-status">Tap button to open camera</div>
    <div class="engine-badge" id="engine-badge"></div>
  </div>

  <div class="divider-row"><hr><span>or type manually</span><hr></div>

  <div class="scan-box">
    <p>Type guest ID and tap Verify</p>
    <input type="text" id="id-input" placeholder="ALYAFEI-WED-2026-001" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="verify-btn" onclick="verifyManual()">&#10003; Verify Guest</button>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <p class="result-title" id="result-title"></p>
    <p class="result-sub" id="result-sub"></p>
    <p class="result-id" id="result-id"></p>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="val" id="stat-total">400</div><div class="lbl">Total cards</div></div>
    <div class="stat green"><div class="val" id="stat-admitted">0</div><div class="lbl">Admitted</div></div>
    <div class="stat red"><div class="val" id="stat-rejected">0</div><div class="lbl">Rejected</div></div>
  </div>

  <div class="log-wrap">
    <div class="log-header"><span>Recent scans</span><button onclick="clearAll()">Clear all</button></div>
    <ul class="log-list" id="log-list"><li class="empty-log">No scans yet</li></ul>
  </div>
  <div class="footer">ALYAFEI WEDDING &middot; VERIFICATION v4.0</div>
</div>

<script>
var CONFIG = { total: 400, prefix: "ALYAFEI-WED-2026", arabic: "حفل زفاف عبدالرحمن اليافعي" };
var admitted = 0, rejected = 0, scannedIds = new Set(), scanLog = [];
var USE_NATIVE = false, nativeDetector = null;
if ("BarcodeDetector" in window) {
  try { nativeDetector = new BarcodeDetector({ formats: ["qr_code"] }); USE_NATIVE = true; } catch(e) {}
}

window.addEventListener("load", function() {
  var b = document.getElementById("engine-badge");
  b.textContent = USE_NATIVE ? "Native QR engine ready" : "jsQR engine ready";
  b.style.color = USE_NATIVE ? "#27ae60" : "#aaa";
});

// ── CAMERA: use file input with capture="environment" ──
// This is the most compatible method — works on ALL phones without permission prompts
function openCamera() {
  document.getElementById("cam-input").click();
}

function handleCapture(input) {
  if (!input.files || !input.files[0]) return;
  setStatus("Reading QR code...", "scanning");
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.getElementById("cam-canvas");
      // Scale down if huge — keeps processing fast
      var maxDim = 1200;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      var found = false;

      // Method 1: Native BarcodeDetector (fastest, most accurate)
      if (USE_NATIVE) {
        nativeDetector.detect(canvas).then(function(codes) {
          if (codes && codes.length > 0 && codes[0].rawValue) {
            found = true;
            var data = codes[0].rawValue.trim();
            setStatus("Found: " + data, "found");
            vibrate(); verify(data);
          } else {
            // Method 2: jsQR fallback
            tryJsQR(canvas, ctx);
          }
        }).catch(function() { tryJsQR(canvas, ctx); });
      } else {
        // Method 2: jsQR
        tryJsQR(canvas, ctx);
      }
      // Reset file input so same photo can be retried
      input.value = "";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function tryJsQR(canvas, ctx) {
  var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var code = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: "attemptBoth" });
  if (code && code.data && code.data.trim()) {
    setStatus("Found: " + code.data.trim(), "found");
    vibrate(); verify(code.data.trim());
  } else {
    setStatus("No QR code found — try again, make sure QR fills the frame", "error");
  }
}

function setStatus(msg, cls) {
  var el = document.getElementById("cam-status");
  el.textContent = msg; el.className = "cam-status" + (cls ? " " + cls : "");
}
function vibrate() { if (navigator.vibrate) navigator.vibrate([80,40,80]); }

function toggleSettings() {
  var p = document.getElementById("settings-panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
}
function saveSettings() {
  var total = parseInt(document.getElementById("set-total").value);
  var prefix = document.getElementById("set-prefix").value.trim().toUpperCase();
  var arabic = document.getElementById("set-arabic").value.trim();
  if (!total || total < 1) { alert("Enter a valid number."); return; }
  CONFIG.total = total; CONFIG.prefix = prefix; CONFIG.arabic = arabic;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("id-input").placeholder = prefix + "-001";
  document.getElementById("top-arabic").textContent = arabic;
  clearAll(); toggleSettings(); alert("Saved!");
}

document.getElementById("id-input").addEventListener("keydown", function(e) { if (e.key === "Enter") verifyManual(); });
document.getElementById("id-input").addEventListener("input", function(e) { e.target.value = e.target.value.toUpperCase(); });
function verifyManual() {
  var raw = document.getElementById("id-input").value;
  if (!raw.trim()) return;
  verify(raw); document.getElementById("id-input").value = ""; document.getElementById("id-input").focus();
}

function parseId(raw) {
  var val = raw.trim().toUpperCase();
  var esc = CONFIG.prefix.replace(/[.*+?^${}()|[\]\]/g, "\$&");
  var m = val.match(new RegExp("^" + esc + "[-]?(\d{1,4})$"));
  if (m) { var n = parseInt(m[1]); if (n>=1&&n<=CONFIG.total) return { valid:true, num:n, full:CONFIG.prefix+"-"+String(n).padStart(3,"0") }; }
  var m2 = val.match(/^(\d{1,4})$/);
  if (m2) { var n2 = parseInt(m2[1]); if (n2>=1&&n2<=CONFIG.total) return { valid:true, num:n2, full:CONFIG.prefix+"-"+String(n2).padStart(3,"0") }; }
  return { valid:false, full:val };
}

function verify(raw) {
  var p = parseId(raw);
  var card = document.getElementById("result-card");
  card.style.display = "block"; card.className = "result-card";
  if (!p.valid) {
    card.classList.add("invalid");
    document.getElementById("result-icon").textContent = "✗";
    document.getElementById("result-title").textContent = "INVALID CARD";
    document.getElementById("result-sub").textContent = "This ID does not match any issued card";
    document.getElementById("result-id").textContent = raw.trim().toUpperCase();
    rejected++; addLog(raw.trim().toUpperCase(), "i");
  } else if (scannedIds.has(p.full)) {
    card.classList.add("duplicate");
    document.getElementById("result-icon").textContent = "⚠";
    document.getElementById("result-title").textContent = "ALREADY SCANNED";
    document.getElementById("result-sub").textContent = "This card was already used to enter";
    document.getElementById("result-id").textContent = p.full;
    rejected++; addLog(p.full, "d");
  } else {
    card.classList.add("valid");
    document.getElementById("result-icon").textContent = "✓";
    document.getElementById("result-title").textContent = "VALID GUEST";
    document.getElementById("result-sub").textContent = "Guest #" + p.num + " of " + CONFIG.total + "  —  Welcome";
    document.getElementById("result-id").textContent = p.full;
    scannedIds.add(p.full); admitted++; addLog(p.full, "v");
  }
  document.getElementById("stat-admitted").textContent = admitted;
  document.getElementById("stat-rejected").textContent = rejected;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
}

function addLog(id, type) {
  var now = new Date();
  var time = now.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  scanLog.unshift({ id:id, type:type, time:time });
  if (scanLog.length > 100) scanLog.pop();
  renderLog();
}
function renderLog() {
  var list = document.getElementById("log-list");
  if (!scanLog.length) { list.innerHTML = "<li class=\"empty-log\">No scans yet</li>"; return; }
  list.innerHTML = scanLog.map(function(e) {
    var lbl = e.type==="v"?"✓":e.type==="d"?"⚠":"✗";
    return "<li class=\"log-item "+e.type+"\"><div class=\"dot\"></div><span class=\"id-text\">"+lbl+" "+e.id+"</span><span class=\"time-text\">"+e.time+"</span></li>";
  }).join("");
}
function clearAll() {
  admitted=0; rejected=0; scannedIds.clear(); scanLog=[];
  document.getElementById("stat-admitted").textContent=0;
  document.getElementById("stat-rejected").textContent=0;
  document.getElementById("result-card").style.display="none";
  renderLog();
}
</script>
</body>
</html>
