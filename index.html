<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Verification — Alyafei</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f0e8; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 0 0 2rem;
  }
  .top-bar {
    width: 100%; background: #1a1208;
    padding: 1rem 1.25rem 0.85rem; text-align: center; position: relative;
  }
  .top-bar .arabic { color: #c8a96e; font-size: 20px; font-weight: 600; direction: rtl; margin-bottom: 3px; }
  .top-bar .sub { color: rgba(200,169,110,0.5); font-size: 11px; letter-spacing: 0.08em; }
  .settings-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: rgba(200,169,110,0.15); border: 1px solid rgba(200,169,110,0.3);
    color: #c8a96e; border-radius: 8px; padding: 6px 10px; font-size: 18px; cursor: pointer;
  }
  .main { width: 100%; max-width: 440px; padding: 1.25rem 1rem 0; }

  /* SETTINGS */
  .settings-panel { display: none; background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; }
  .settings-panel h3 { font-size: 14px; color: #555; margin-bottom: 12px; font-weight: 600; }
  .settings-panel label { display: block; font-size: 12px; color: #777; margin-bottom: 4px; margin-top: 10px; }
  .settings-panel input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #1a1208; outline: none; }
  .settings-panel input:focus { border-color: #c8a96e; }
  .save-btn { width: 100%; margin-top: 12px; background: #1a1208; color: #c8a96e; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* RESULT CARD - shown when ?id= is in URL */
  .result-card { border-radius: 14px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; animation: pop 0.25s ease; }
  @keyframes pop { from { transform: scale(0.93); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  .result-card.valid     { background: #eafaf1; border: 2px solid #27ae60; }
  .result-card.invalid   { background: #fdf0f0; border: 2px solid #e74c3c; }
  .result-card.duplicate { background: #fff8e6; border: 2px solid #f39c12; }
  .result-icon  { font-size: 64px; margin-bottom: 8px; }
  .result-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .result-card.valid     .result-title { color: #1e8449; }
  .result-card.invalid   .result-title { color: #c0392b; }
  .result-card.duplicate .result-title { color: #d68910; }
  .result-sub { font-size: 15px; margin-bottom: 8px; }
  .result-card.valid     .result-sub { color: #27ae60; }
  .result-card.invalid   .result-sub { color: #e74c3c; }
  .result-card.duplicate .result-sub { color: #f39c12; }
  .result-id { font-size: 13px; font-family: monospace; opacity: 0.55; color: #333; margin-top: 4px; }

  /* HOW TO USE - shown when no ?id= in URL */
  .how-card { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; text-align: center; }
  .how-card .icon { font-size: 40px; margin-bottom: 10px; }
  .how-card h3 { font-size: 16px; font-weight: 600; color: #1a1208; margin-bottom: 8px; }
  .how-card p { font-size: 13px; color: #888; line-height: 1.6; }

  /* MANUAL INPUT */
  .divider-row { display: flex; align-items: center; gap: 10px; margin: 0.5rem 0 1rem; }
  .divider-row hr { flex:1; border:none; border-top:1px solid #e0d8c8; }
  .divider-row span { font-size: 12px; color: #bbb; white-space: nowrap; }
  .scan-box { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; text-align: center; }
  .scan-box p { font-size: 13px; color: #888; margin-bottom: 10px; }
  .scan-box input { width: 100%; border: 1.5px solid #e0d8c8; border-radius: 10px; padding: 12px 14px; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; color: #1a1208; outline: none; margin-bottom: 10px; -webkit-appearance: none; }
  .scan-box input:focus { border-color: #c8a96e; }
  .verify-btn { width: 100%; background: #1a1208; color: #c8a96e; border: none; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .verify-btn:active { transform: scale(0.98); }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .stat { background: #fff; border: 1px solid #e0d8c8; border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; margin-bottom: 2px; color: #1a1208; }
  .stat .lbl { font-size: 11px; color: #999; }
  .stat.green .val { color: #27ae60; }
  .stat.red   .val { color: #e74c3c; }

  /* LOG */
  .log-wrap { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1rem; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .log-header span { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.06em; text-transform: uppercase; }
  .log-header button { font-size: 11px; padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background: #f9f9f9; cursor: pointer; color: #888; }
  .log-list { list-style: none; max-height: 220px; overflow-y: auto; }
  .log-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; margin-bottom: 4px; font-size: 13px; }
  .log-item.v { background: #eafaf1; } .log-item.i { background: #fdf0f0; } .log-item.d { background: #fff8e6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .v .dot { background: #27ae60; } .i .dot { background: #e74c3c; } .d .dot { background: #f39c12; }
  .id-text { flex: 1; font-family: monospace; font-size: 12px; color: #333; }
  .time-text { font-size: 11px; color: #aaa; white-space: nowrap; }
  .empty-log { font-size: 13px; color: #bbb; text-align: center; padding: 16px 0; }
  .footer { margin-top: 1.5rem; text-align: center; font-size: 11px; color: #bbb; letter-spacing: 0.03em; }

  /* SCAN AGAIN BUTTON */
  .scan-again { display: block; width: 100%; margin-top: 12px; background: #1a1208; color: #c8a96e; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
  .scan-again:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="top-bar">
  <p class="arabic" id="top-arabic">&#1581;&#1601;&#1604; &#1586;&#1601;&#1575;&#1601; &#1593;&#1576;&#1583;&#1575;&#1604;&#1585;&#1581;&#1605;&#1606; &#1575;&#1604;&#1610;&#1575;&#1601;&#1593;&#1610;</p>
  <p class="sub">GUEST VERIFICATION SYSTEM</p>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
</div>

<div class="main">

  <div class="settings-panel" id="settings-panel">
    <h3>&#9881; SETTINGS</h3>
    <label>Total number of cards issued</label>
    <input type="number" id="set-total" value="400" min="1" max="9999">
    <label>Card ID prefix</label>
    <input type="text" id="set-prefix" value="ALYAFEI-WED-2026">
    <label>Event name (Arabic)</label>
    <input type="text" id="set-arabic" value="&#1581;&#1601;&#1604; &#1586;&#1601;&#1575;&#1601; &#1593;&#1576;&#1583;&#1575;&#1604;&#1585;&#1581;&#1605;&#1606; &#1575;&#1604;&#1610;&#1575;&#1601;&#1593;&#1610;" dir="rtl">
    <button class="save-btn" onclick="saveSettings()">Save &amp; Apply</button>
  </div>

  <!-- RESULT or HOW-TO shown here by JS -->
  <div id="main-content"></div>

  <div class="divider-row"><hr><span>or type manually</span><hr></div>

  <div class="scan-box">
    <p>Type guest ID and tap Verify</p>
    <input type="text" id="id-input" placeholder="ALYAFEI-WED-2026-001"
      autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="verify-btn" onclick="verifyManual()">&#10003; Verify Guest</button>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="val" id="stat-total">400</div><div class="lbl">Total cards</div></div>
    <div class="stat green"><div class="val" id="stat-admitted">0</div><div class="lbl">Admitted</div></div>
    <div class="stat red"><div class="val" id="stat-rejected">0</div><div class="lbl">Rejected</div></div>
  </div>

  <div class="log-wrap">
    <div class="log-header"><span>Recent scans</span><button onclick="clearAll()">Clear all</button></div>
    <ul class="log-list" id="log-list"><li class="empty-log">No scans yet</li></ul>
  </div>

  <div class="footer">ALYAFEI WEDDING &middot; VERIFICATION v8.0</div>
</div>

<script>
var CONFIG = { total: 400, prefix: "ALYAFEI-WED-2026", arabic: "حفل زفاف عبدالرحمن اليافعي" };
var admitted = 0, rejected = 0, scannedIds = new Set(), scanLog = [];

// ── ON LOAD: check URL for ?id= param ──
window.addEventListener("load", function() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  if (id) {
    // QR code was scanned — verify and show result
    var content = document.getElementById("main-content");
    var parsed = parseId(id);
    var html = "";
    if (!parsed.valid) {
      html = makeResult("invalid", "&#10007;", "INVALID CARD", "This card is not genuine", id.toUpperCase());
      rejected++; addLog(id.toUpperCase(), "i");
    } else if (scannedIds.has(parsed.full)) {
      html = makeResult("duplicate", "&#9888;", "ALREADY SCANNED", "This card was already used to enter", parsed.full);
      rejected++; addLog(parsed.full, "d");
    } else {
      html = makeResult("valid", "&#10003;", "VALID GUEST", "Guest #" + parsed.num + " of " + CONFIG.total + " &mdash; Welcome", parsed.full);
      scannedIds.add(parsed.full); admitted++; addLog(parsed.full, "v");
    }
    html += "<button class=\"scan-again\" onclick=\"window.location.href=window.location.pathname\">&#128247; Scan next guest</button>";
    content.innerHTML = html;
    updateStats();
    if (navigator.vibrate) navigator.vibrate([80,40,80]);
  } else {
    // No ID in URL — show instructions
    document.getElementById("main-content").innerHTML =
      "<div class=\"how-card\">" +
      "<div class=\"icon\">&#128247;</div>" +
      "<h3>How to use</h3>" +
      "<p>Point your phone camera at a guest QR code. The result will appear instantly on this page.</p>" +
      "</div>";
  }
  document.getElementById("stat-total").textContent = CONFIG.total;
});

function makeResult(cls, icon, title, sub, id) {
  return "<div class=\"result-card " + cls + "\">" +
    "<div class=\"result-icon\">" + icon + "</div>" +
    "<p class=\"result-title\">" + title + "</p>" +
    "<p class=\"result-sub\">" + sub + "</p>" +
    "<p class=\"result-id\">" + id + "</p>" +
    "</div>";
}

// ── SETTINGS ──
function toggleSettings() {
  var p = document.getElementById("settings-panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
}
function saveSettings() {
  var total = parseInt(document.getElementById("set-total").value);
  var prefix = document.getElementById("set-prefix").value.trim().toUpperCase();
  var arabic = document.getElementById("set-arabic").value.trim();
  if (!total || total < 1) { alert("Enter a valid number."); return; }
  CONFIG.total = total; CONFIG.prefix = prefix; CONFIG.arabic = arabic;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("id-input").placeholder = prefix + "-001";
  document.getElementById("top-arabic").textContent = arabic;
  clearAll(); toggleSettings(); alert("Saved!");
}

// ── MANUAL INPUT ──
document.addEventListener("DOMContentLoaded", function() {
  var inp = document.getElementById("id-input");
  if (inp) {
    inp.addEventListener("keydown", function(e) { if (e.key === "Enter") verifyManual(); });
    inp.addEventListener("input", function(e) { e.target.value = e.target.value.toUpperCase(); });
  }
});
function verifyManual() {
  var raw = document.getElementById("id-input").value;
  if (!raw.trim()) return;
  var parsed = parseId(raw);
  var content = document.getElementById("main-content");
  var html = "";
  if (!parsed.valid) {
    html = makeResult("invalid", "&#10007;", "INVALID CARD", "This ID does not match any issued card", raw.trim().toUpperCase());
    rejected++; addLog(raw.trim().toUpperCase(), "i");
  } else if (scannedIds.has(parsed.full)) {
    html = makeResult("duplicate", "&#9888;", "ALREADY SCANNED", "This card was already used to enter", parsed.full);
    rejected++; addLog(parsed.full, "d");
  } else {
    html = makeResult("valid", "&#10003;", "VALID GUEST", "Guest #" + parsed.num + " of " + CONFIG.total + " &mdash; Welcome", parsed.full);
    scannedIds.add(parsed.full); admitted++; addLog(parsed.full, "v");
  }
  html += "<button class=\"scan-again\" onclick=\"window.location.href=window.location.pathname\">&#128247; Scan next guest</button>";
  content.innerHTML = html;
  updateStats();
  document.getElementById("id-input").value = "";
  content.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ── PARSE ID ──
function parseId(raw) {
  var val = raw.trim().toUpperCase();
  var esc = CONFIG.prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var m = val.match(new RegExp("^" + esc + "[-]?(\\d{1,4})$"));
  if (m) { var n = parseInt(m[1]); if (n>=1&&n<=CONFIG.total) return { valid:true, num:n, full:CONFIG.prefix+"-"+String(n).padStart(3,"0") }; }
  var m2 = val.match(/^(\d{1,4})$/);
  if (m2) { var n2=parseInt(m2[1]); if (n2>=1&&n2<=CONFIG.total) return { valid:true, num:n2, full:CONFIG.prefix+"-"+String(n2).padStart(3,"0") }; }
  return { valid:false, full:val };
}

// ── STATS & LOG ──
function updateStats() {
  document.getElementById("stat-admitted").textContent = admitted;
  document.getElementById("stat-rejected").textContent = rejected;
}
function addLog(id, type) {
  var now = new Date();
  var time = now.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  scanLog.unshift({ id:id, type:type, time:time });
  if (scanLog.length > 100) scanLog.pop();
  renderLog();
}
function renderLog() {
  var list = document.getElementById("log-list");
  if (!scanLog.length) { list.innerHTML = "<li class=\"empty-log\">No scans yet</li>"; return; }
  list.innerHTML = scanLog.map(function(e) {
    var lbl = e.type==="v"?"&#10003;":e.type==="d"?"&#9888;":"&#10007;";
    return "<li class=\"log-item "+e.type+"\"><div class=\"dot\"></div><span class=\"id-text\">"+lbl+" "+e.id+"</span><span class=\"time-text\">"+e.time+"</span></li>";
  }).join("");
}
function clearAll() {
  admitted=0; rejected=0; scannedIds.clear(); scanLog=[];
  updateStats();
  document.getElementById("result-card") && (document.getElementById("result-card").style.display="none");
  renderLog();
}
</script>
</body>
</html>
