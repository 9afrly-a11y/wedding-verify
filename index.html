<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Verification — Alyafei</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 2rem;
  }

  /* TOP BAR */
  .top-bar {
    width: 100%;
    background: #1a1208;
    padding: 1rem 1.25rem 0.85rem;
    text-align: center;
    position: relative;
  }
  .top-bar .arabic { color: #c8a96e; font-size: 20px; font-weight: 600; direction: rtl; margin-bottom: 3px; }
  .top-bar .sub { color: rgba(200,169,110,0.5); font-size: 11px; letter-spacing: 0.08em; }
  .settings-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: rgba(200,169,110,0.15); border: 1px solid rgba(200,169,110,0.3);
    color: #c8a96e; border-radius: 8px; padding: 6px 10px; font-size: 18px;
    cursor: pointer; line-height: 1;
  }

  .main { width: 100%; max-width: 440px; padding: 1.25rem 1rem 0; }

  /* SETTINGS */
  .settings-panel {
    display: none; background: #fff; border: 1px solid #e0d8c8;
    border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem;
  }
  .settings-panel h3 { font-size: 14px; color: #555; margin-bottom: 12px; font-weight: 600; }
  .settings-panel label { display: block; font-size: 12px; color: #777; margin-bottom: 4px; margin-top: 10px; }
  .settings-panel input {
    width: 100%; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; color: #1a1208; outline: none;
  }
  .settings-panel input:focus { border-color: #c8a96e; }
  .save-btn {
    width: 100%; margin-top: 12px; background: #1a1208; color: #c8a96e;
    border: none; border-radius: 8px; padding: 10px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }

  /* CAMERA SCANNER */
  .camera-card {
    background: #fff; border: 1px solid #e0d8c8; border-radius: 14px;
    padding: 1.1rem; margin-bottom: 1rem;
  }
  .camera-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .camera-header span { font-size: 13px; color: #888; }
  .cam-toggle {
    background: #1a1208; color: #c8a96e; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px; width: 100%;
    justify-content: center;
  }
  .cam-toggle.active { background: #c0392b; color: #fff; }
  .cam-toggle:active { transform: scale(0.98); }

  /* VIDEO VIEWFINDER */
  .viewfinder-wrap {
    display: none; position: relative; margin-top: 12px;
    border-radius: 12px; overflow: hidden; background: #000;
  }
  #cam-video {
    width: 100%; display: block; border-radius: 12px;
    max-height: 300px; object-fit: cover;
  }
  #cam-canvas { display: none; }

  /* Scan overlay crosshair */
  .scan-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; align-items: center; justify-content: center;
  }
  .scan-box-frame {
    width: 200px; height: 200px; position: relative;
  }
  .scan-box-frame::before, .scan-box-frame::after,
  .scan-box-frame span::before, .scan-box-frame span::after {
    content: ''; position: absolute; width: 28px; height: 28px;
    border-color: #c8a96e; border-style: solid;
  }
  .scan-box-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
  .scan-box-frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
  .scan-box-frame span::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
  .scan-box-frame span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

  /* Scan line animation */
  .scan-line {
    position: absolute; left: 6%; right: 6%; height: 2px;
    background: linear-gradient(90deg, transparent, #c8a96e, transparent);
    animation: scanline 1.8s ease-in-out infinite;
  }
  @keyframes scanline {
    0%   { top: 8%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 88%; opacity: 0; }
  }

  .cam-status {
    text-align: center; font-size: 12px; color: #aaa;
    margin-top: 8px; min-height: 18px;
  }
  .cam-status.scanning { color: #c8a96e; }
  .cam-status.found { color: #27ae60; font-weight: 600; }
  .cam-status.error { color: #e74c3c; }

  /* MANUAL INPUT */
  .divider-row {
    display: flex; align-items: center; gap: 10px; margin: 1rem 0 0.75rem;
  }
  .divider-row hr { flex: 1; border: none; border-top: 1px solid #e0d8c8; }
  .divider-row span { font-size: 12px; color: #bbb; white-space: nowrap; }

  .scan-box {
    background: #fff; border: 1px solid #e0d8c8; border-radius: 14px;
    padding: 1.1rem; margin-bottom: 1rem; text-align: center;
  }
  .scan-box p { font-size: 13px; color: #888; margin-bottom: 10px; }
  .scan-box input {
    width: 100%; border: 1.5px solid #e0d8c8; border-radius: 10px;
    padding: 12px 14px; font-size: 16px; letter-spacing: 0.05em;
    text-transform: uppercase; text-align: center; color: #1a1208;
    outline: none; margin-bottom: 10px; -webkit-appearance: none;
  }
  .scan-box input:focus { border-color: #c8a96e; }
  .verify-btn {
    width: 100%; background: #1a1208; color: #c8a96e; border: none;
    border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .verify-btn:active { transform: scale(0.98); }

  /* RESULT */
  .result-card {
    border-radius: 14px; padding: 1.25rem; text-align: center;
    margin-bottom: 1rem; display: none; animation: pop 0.2s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0.5; } to { transform: scale(1); opacity: 1; } }
  .result-card.valid     { background: #eafaf1; border: 2px solid #27ae60; }
  .result-card.invalid   { background: #fdf0f0; border: 2px solid #e74c3c; }
  .result-card.duplicate { background: #fff8e6; border: 2px solid #f39c12; }
  .result-icon  { font-size: 52px; margin-bottom: 6px; }
  .result-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .result-card.valid     .result-title { color: #1e8449; }
  .result-card.invalid   .result-title { color: #c0392b; }
  .result-card.duplicate .result-title { color: #d68910; }
  .result-sub { font-size: 14px; margin-bottom: 6px; }
  .result-card.valid     .result-sub { color: #27ae60; }
  .result-card.invalid   .result-sub { color: #e74c3c; }
  .result-card.duplicate .result-sub { color: #f39c12; }
  .result-id { font-size: 12px; font-family: monospace; opacity: 0.6; color: #333; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .stat { background: #fff; border: 1px solid #e0d8c8; border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; margin-bottom: 2px; color: #1a1208; }
  .stat .lbl { font-size: 11px; color: #999; }
  .stat.green .val { color: #27ae60; }
  .stat.red   .val { color: #e74c3c; }

  /* LOG */
  .log-wrap { background: #fff; border: 1px solid #e0d8c8; border-radius: 14px; padding: 1rem; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .log-header span { font-size: 12px; font-weight: 600; color: #999; letter-spacing: 0.06em; text-transform: uppercase; }
  .log-header button {
    font-size: 11px; padding: 4px 10px; border: 1px solid #ddd;
    border-radius: 6px; background: #f9f9f9; cursor: pointer; color: #888;
  }
  .log-list { list-style: none; max-height: 220px; overflow-y: auto; }
  .log-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 8px; margin-bottom: 4px; font-size: 13px;
  }
  .log-item.v { background: #eafaf1; }
  .log-item.i { background: #fdf0f0; }
  .log-item.d { background: #fff8e6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .v .dot { background: #27ae60; }
  .i .dot { background: #e74c3c; }
  .d .dot { background: #f39c12; }
  .id-text   { flex: 1; font-family: monospace; font-size: 12px; color: #333; }
  .time-text { font-size: 11px; color: #aaa; white-space: nowrap; }
  .empty-log { font-size: 13px; color: #bbb; text-align: center; padding: 16px 0; }

  .footer { margin-top: 1.5rem; text-align: center; font-size: 11px; color: #bbb; letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="top-bar">
  <p class="arabic" id="top-arabic">حفل زفاف عبدالرحمن اليافعي</p>
  <p class="sub">GUEST VERIFICATION SYSTEM</p>
  <button class="settings-btn" onclick="toggleSettings()">⚙</button>
</div>

<div class="main">

  <!-- SETTINGS -->
  <div class="settings-panel" id="settings-panel">
    <h3>⚙ SETTINGS</h3>
    <label>Total number of cards issued</label>
    <input type="number" id="set-total" value="400" min="1" max="9999">
    <label>Card ID prefix</label>
    <input type="text" id="set-prefix" value="ALYAFEI-WED-2026">
    <label>Event name (Arabic)</label>
    <input type="text" id="set-arabic" value="حفل زفاف عبدالرحمن اليافعي" dir="rtl">
    <button class="save-btn" onclick="saveSettings()">Save &amp; Apply</button>
  </div>

  <!-- CAMERA SCANNER -->
  <div class="camera-card">
    <div class="camera-header">
      <span>📷 Camera QR Scanner</span>
    </div>
    <button class="cam-toggle" id="cam-btn" onclick="toggleCamera()">
      📷 &nbsp;Open Camera to Scan
    </button>

    <div class="viewfinder-wrap" id="viewfinder-wrap">
      <video id="cam-video" playsinline autoplay muted></video>
      <canvas id="cam-canvas"></canvas>
      <div class="scan-overlay">
        <div class="scan-box-frame">
          <span></span>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>

    <div class="cam-status" id="cam-status">Camera is off</div>
  </div>

  <!-- DIVIDER -->
  <div class="divider-row">
    <hr><span>or type manually</span><hr>
  </div>

  <!-- MANUAL INPUT -->
  <div class="scan-box">
    <p>Type guest ID and tap Verify</p>
    <input type="text" id="id-input" placeholder="ALYAFEI-WED-2026-001"
      autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button class="verify-btn" onclick="verifyManual()">✓ Verify Guest</button>
  </div>

  <!-- RESULT -->
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <p class="result-title" id="result-title"></p>
    <p class="result-sub" id="result-sub"></p>
    <p class="result-id" id="result-id"></p>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat">
      <div class="val" id="stat-total">400</div>
      <div class="lbl">Total cards</div>
    </div>
    <div class="stat green">
      <div class="val" id="stat-admitted">0</div>
      <div class="lbl">Admitted</div>
    </div>
    <div class="stat red">
      <div class="val" id="stat-rejected">0</div>
      <div class="lbl">Rejected</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-wrap">
    <div class="log-header">
      <span>Recent scans</span>
      <button onclick="clearAll()">Clear all</button>
    </div>
    <ul class="log-list" id="log-list">
      <li class="empty-log">No scans yet</li>
    </ul>
  </div>

  <div class="footer">ALYAFEI WEDDING · VERIFICATION v2.0</div>
</div>

<script>
  var CONFIG = { total: 400, prefix: 'ALYAFEI-WED-2026', arabic: 'حفل زفاف عبدالرحمن اليافعي' };
  var admitted = 0, rejected = 0;
  var scannedIds = new Set();
  var scanLog = [];

  // ── CAMERA ──
  var cameraOn = false;
  var videoStream = null;
  var rafId = null;
  var lastScanTime = 0;
  var cooldown = 2500;
  var frameCount = 0;

  function toggleCamera() {
    if (cameraOn) { stopCamera(); } else { startCamera(); }
  }

  function startCamera() {
    // Request highest resolution possible for better QR detection
    var constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };
    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream) {
        videoStream = stream;
        var video = document.getElementById('cam-video');
        video.srcObject = stream;
        video.play();
        video.onloadedmetadata = function() {
          document.getElementById('viewfinder-wrap').style.display = 'block';
          document.getElementById('cam-btn').innerHTML = '⏹ &nbsp;Stop Camera';
          document.getElementById('cam-btn').classList.add('active');
          document.getElementById('cam-status').textContent = 'Scanning — point at QR code';
          document.getElementById('cam-status').className = 'cam-status scanning';
          cameraOn = true;
          frameCount = 0;
          rafId = requestAnimationFrame(scanFrame);
        };
      })
      .catch(function(err) {
        var msg = 'Camera access denied.';
        if (err.name === 'NotAllowedError') {
          msg = 'Camera permission denied. Open Safari Settings → Camera → Allow.';
        } else if (err.name === 'NotFoundError') {
          msg = 'No camera found on this device.';
        }
        document.getElementById('cam-status').textContent = msg;
        document.getElementById('cam-status').className = 'cam-status error';
      });
  }

  function stopCamera() {
    if (videoStream) {
      videoStream.getTracks().forEach(function(t) { t.stop(); });
      videoStream = null;
    }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    var video = document.getElementById('cam-video');
    video.srcObject = null;
    document.getElementById('viewfinder-wrap').style.display = 'none';
    document.getElementById('cam-btn').innerHTML = '📷 &nbsp;Open Camera to Scan';
    document.getElementById('cam-btn').classList.remove('active');
    document.getElementById('cam-status').textContent = 'Camera is off';
    document.getElementById('cam-status').className = 'cam-status';
    cameraOn = false;
  }

  function scanFrame() {
    if (!cameraOn) return;
    frameCount++;

    // Only process every 3rd frame — reduces CPU load, keeps it responsive
    if (frameCount % 3 !== 0) {
      rafId = requestAnimationFrame(scanFrame);
      return;
    }

    var video = document.getElementById('cam-video');
    var canvas = document.getElementById('cam-canvas');

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      var vw = video.videoWidth;
      var vh = video.videoHeight;

      var now = Date.now();
      if (now - lastScanTime > cooldown) {
        var code = null;

        // Pass 1: scan full frame at full resolution
        canvas.width  = vw;
        canvas.height = vh;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, vw, vh);
        var imgFull = ctx.getImageData(0, 0, vw, vh);
        code = jsQR(imgFull.data, vw, vh, { inversionAttempts: 'attemptBoth' });

        // Pass 2: if not found, scan centre crop (zoomed in) — helps with screen glare
        if (!code) {
          var cropSize = Math.min(vw, vh) * 0.65;
          var cx = (vw - cropSize) / 2;
          var cy = (vh - cropSize) / 2;
          var cropCanvas = document.createElement('canvas');
          cropCanvas.width  = 600;
          cropCanvas.height = 600;
          var cropCtx = cropCanvas.getContext('2d');
          cropCtx.drawImage(video, cx, cy, cropSize, cropSize, 0, 0, 600, 600);
          var imgCrop = cropCtx.getImageData(0, 0, 600, 600);
          code = jsQR(imgCrop.data, 600, 600, { inversionAttempts: 'attemptBoth' });
        }

        if (code && code.data && code.data.trim() !== '') {
          lastScanTime = now;
          var detected = code.data.trim();
          document.getElementById('cam-status').textContent = '✓ Found: ' + detected;
          document.getElementById('cam-status').className = 'cam-status found';
          vibrate();
          verify(detected);
          setTimeout(function() {
            if (cameraOn) {
              document.getElementById('cam-status').textContent = 'Scanning — point at QR code';
              document.getElementById('cam-status').className = 'cam-status scanning';
            }
          }, 2500);
        }
      }
    }
    rafId = requestAnimationFrame(scanFrame);
  }

  function vibrate() {
    if (navigator.vibrate) { navigator.vibrate([80, 40, 80]); }
  }

  // ── SETTINGS ──
  function toggleSettings() {
    var p = document.getElementById('settings-panel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  function saveSettings() {
    var total  = parseInt(document.getElementById('set-total').value);
    var prefix = document.getElementById('set-prefix').value.trim().toUpperCase();
    var arabic = document.getElementById('set-arabic').value.trim();
    if (!total || total < 1) { alert('Enter a valid number of cards.'); return; }
    if (!prefix) { alert('Enter a valid prefix.'); return; }
    CONFIG.total  = total;
    CONFIG.prefix = prefix;
    CONFIG.arabic = arabic;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('id-input').placeholder = prefix + '-001';
    document.getElementById('top-arabic').textContent = arabic || 'حفل زفاف عبدالرحمن اليافعي';
    clearAll();
    toggleSettings();
    alert('Saved! Log and counters reset.');
  }

  // ── MANUAL INPUT ──
  document.getElementById('id-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') verifyManual();
  });
  document.getElementById('id-input').addEventListener('input', function(e) {
    e.target.value = e.target.value.toUpperCase();
  });

  function verifyManual() {
    var raw = document.getElementById('id-input').value;
    if (!raw.trim()) return;
    verify(raw);
    document.getElementById('id-input').value = '';
    document.getElementById('id-input').focus();
  }

  // ── PARSE ──
  function parseId(raw) {
    var val = raw.trim().toUpperCase();
    var escaped = CONFIG.prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('^' + escaped + '[-]?(\\d{1,4})$');
    var m = val.match(re);
    if (m) {
      var n = parseInt(m[1]);
      if (n >= 1 && n <= CONFIG.total)
        return { valid: true, num: n, full: CONFIG.prefix + '-' + String(n).padStart(3,'0') };
    }
    var n2 = val.match(/^(\d{1,4})$/);
    if (n2) {
      var num = parseInt(n2[1]);
      if (num >= 1 && num <= CONFIG.total)
        return { valid: true, num: num, full: CONFIG.prefix + '-' + String(num).padStart(3,'0') };
    }
    return { valid: false, full: val };
  }

  // ── VERIFY ──
  function verify(raw) {
    var parsed = parseId(raw);
    var card  = document.getElementById('result-card');
    var icon  = document.getElementById('result-icon');
    var title = document.getElementById('result-title');
    var sub   = document.getElementById('result-sub');
    var idEl  = document.getElementById('result-id');

    card.style.display = 'block';
    card.className = 'result-card';

    if (!parsed.valid) {
      card.classList.add('invalid');
      icon.textContent  = '✗';
      title.textContent = 'INVALID CARD';
      sub.textContent   = 'This ID does not match any issued card';
      idEl.textContent  = raw.trim().toUpperCase();
      rejected++;
      addLog(raw.trim().toUpperCase(), 'i');
    } else if (scannedIds.has(parsed.full)) {
      card.classList.add('duplicate');
      icon.textContent  = '⚠';
      title.textContent = 'ALREADY SCANNED';
      sub.textContent   = 'This card was already used to enter';
      idEl.textContent  = parsed.full;
      rejected++;
      addLog(parsed.full, 'd');
    } else {
      card.classList.add('valid');
      icon.textContent  = '✓';
      title.textContent = 'VALID GUEST';
      sub.textContent   = 'Guest #' + parsed.num + ' of ' + CONFIG.total + '  —  Welcome';
      idEl.textContent  = parsed.full;
      scannedIds.add(parsed.full);
      admitted++;
      addLog(parsed.full, 'v');
    }

    document.getElementById('stat-admitted').textContent = admitted;
    document.getElementById('stat-rejected').textContent = rejected;

    // Scroll result into view on mobile
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ── LOG ──
  function addLog(id, type) {
    var now  = new Date();
    var time = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    scanLog.unshift({ id: id, type: type, time: time });
    if (scanLog.length > 100) scanLog.pop();
    renderLog();
  }

  function renderLog() {
    var list = document.getElementById('log-list');
    if (!scanLog.length) {
      list.innerHTML = '<li class="empty-log">No scans yet</li>';
      return;
    }
    list.innerHTML = scanLog.map(function(e) {
      var lbl = e.type === 'v' ? '✓' : e.type === 'd' ? '⚠' : '✗';
      return '<li class="log-item ' + e.type + '">' +
        '<div class="dot"></div>' +
        '<span class="id-text">' + lbl + ' ' + e.id + '</span>' +
        '<span class="time-text">' + e.time + '</span>' +
        '</li>';
    }).join('');
  }

  function clearAll() {
    admitted = 0; rejected = 0;
    scannedIds.clear(); scanLog = [];
    document.getElementById('stat-admitted').textContent = 0;
    document.getElementById('stat-rejected').textContent = 0;
    document.getElementById('result-card').style.display = 'none';
    renderLog();
  }
</script>
</body>
</html>
